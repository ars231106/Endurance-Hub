  body:`
<p>Three separate programs talking over a network.</p>
<ul>
<li><b>Client</b> — Chrome. Downloads an HTML file, shows it, sends messages when you click.</li>
<li><b>Server</b> — your Python program on Render. Waits, does work, replies, waits again.</li>
<li><b>Database</b> — PostgreSQL. A different program whose only job is storing data on disk so it survives restarts.</li>
</ul>
<div class="note">You proved the third one exists by accident: accounts made on <code>localhost</code> didn't work on the live site. Same code, two different databases. If the server <i>were</i> the storage, that couldn't happen.</div>
<h3>What a message looks like</h3>
<pre><code>POST /activities HTTP/1.1
Host: endurancehub-dyq3.onrender.com
Authorization: Bearer eyJhbGciOiJIUzI1NiIs...
Content-Type: application/json

{"activity_type":"run","distance_km":5,"duration_min":30,"rpe":6}</code></pre>
<table><tr><th>Part</th><th>Meaning</th></tr>
<tr><td>Method</td><td>the kind of action — GET fetch, POST create, PUT update, DELETE remove</td></tr>
<tr><td>Path</td><td>which action</td></tr>
<tr><td>Headers</td><td>metadata, including who you are</td></tr>
<tr><td>Body</td><td>the data, as JSON</td></tr></table>
<h3>Status codes in your app</h3>
<table><tr><th>Code</th><th>Where yours uses it</th></tr>
<tr><td>200</td><td>login, /me, updates</td></tr>
<tr><td>201</td><td>register, create activity</td></tr>
<tr><td>204</td><td>delete activity — success, empty body</td></tr>
<tr><td>401</td><td>bad password, bad token</td></tr>
<tr><td>403</td><td>correct password, email not verified</td></tr>
<tr><td>404</td><td>missing activity, or someone else's</td></tr>
<tr><td>409</td><td>email already registered</td></tr>
<tr><td>422</td><td>malformed data — Pydantic rejected it</td></tr>

<h3>You've watched this in the logs</h3>
<pre><code>INFO: "GET /health HTTP/1.1" 200 OK
INFO: "POST /resend-otp HTTP/1.1" 429 Too Many Requests</code></pre>
<p>Line one is Render itself pinging your health check every few seconds. Line two is your own 60-second cooldown rejecting a resend. Every line in that log is one request and one response.</p>
<h3>The idea everything rests on</h3>
<p>Between requests the server remembers <b>nothing</b> about you. Each request arrives cold. That's <b>stateless</b>, and it's the entire reason the <code>Authorization</code> header exists — the server can't remember you logged in a minute ago, so every request must carry proof.</p>`,

<pre><code>app = FastAPI(title="EnduranceHub API", version="1.0.0")

<h4>The exception handler — your "Failed to fetch" fix</h4>
<p>When an endpoint crashes, the exception escapes <i>past</i> the CORS middleware. The 500 arrives with no CORS headers, the browser refuses to read it, and JavaScript sees a network failure instead of an error message. This handler catches the crash <b>inside</b> the CORS layer, logs the full traceback server-side, and returns a deliberately generic message. Never leak stack traces to users — they reveal file paths and library versions.</p>

<h4>Serving the frontend</h4>
<p><code>parents[2]</code> walks up three levels from <code>backend/app/main.py</code> to the repo root, then into <code>frontend/</code>. Serving it from FastAPI gives the app a real <code>http://</code> origin, which the browser's password manager requires and OAuth demands — and makes frontend and API same-origin, so CORS stops mattering at all.</p>

<h3>The request lifecycle</h3>
<pre><code>browser
 → uvicorn                (text → Python objects)
   → exception handler    (catches anything below)
     → CORS middleware    (adds headers)
       → route matching   (which function?)
         → dependencies   (get_current_user → get_db)
           → your endpoint
         ← return value
       ← response_model filters it
     ← JSON encoding
 ← HTTP response</code></pre>

<h3>How routing actually works</h3>
<p>At startup FastAPI reads every decorator and builds a list:</p>
<table><tr><th>Method</th><th>Path</th><th>Function</th></tr>
<tr><td>POST</td><td>/activities</td><td>create_activity</td></tr>
<tr><td>GET</td><td>/activities</td><td>list_activities</td></tr>
<tr><td>DELETE</td><td>/activities/{id}</td><td>delete_activity</td></tr></table>
<p>A message arrives, it finds the row where <b>both</b> method and path match. Same path with a different verb is a different function.</p>

<h3>The four places data comes from</h3>
<p>You never call your endpoints — FastAPI does, so it must fill in the arguments. It decides from the type hints.</p>
<pre><code>def get_activity(activity_id: int,                        # 1 PATH
                 db: Session = Depends(get_db)):          # 4 DEPENDENCY

def list_activities(limit: int = 50, offset: int = 0):    # 2 QUERY
def create_activity(payload: ActivityCreate):             # 3 BODY</code></pre>
<table><tr><th>#</th><th>Source</th><th>Rule FastAPI applies</th></tr>
<tr><td>1</td><td>path</td><td>name appears in {braces} in the route</td></tr>
<tr><td>2</td><td>query string</td><td>simple type with a default</td></tr>
<tr><td>3</td><td>body</td><td>the type is a Pydantic model</td></tr>
<tr><td>4</td><td>dependency</td><td>default is <code>Depends(...)</code></td></tr></table>

<h3>Routers</h3>
<pre><code>router = APIRouter(prefix="/activities", tags=["activities"])</code></pre>
<p><code>prefix</code> prepends to every route in the file, so <code>@router.get("")</code> becomes <code>GET /activities</code>. <code>tags</code> groups them in the docs. <code>main.py</code> composes rather than builds — which is why it's ~100 lines for 22 endpoints.</p>
<p>Open <b>/docs</b> — FastAPI generated that page from your type hints alone.</p>`,

  n:3, title:"Talking to the database", sub:"database.py — engine · session · get_db",
  body:`
<p>PostgreSQL is a separate program. You must connect first, and connecting costs ~30ms. Doing that per request would crawl.</p>

<div class="file">backend/app/databases/database.py</div>
<pre><code>import os
from sqlalchemy import create_engine
from sqlalchemy.orm import sessionmaker

DATABASE_URL = os.getenv(
    "DATABASE_URL",
    "postgresql://postgres:PASSWORD@localhost:5432/endurancehub",
)

# Several hosts (Render, Heroku) hand out "postgres://", a scheme
# SQLAlchemy 2 no longer recognises.
if DATABASE_URL.startswith("postgres://"):
    DATABASE_URL = DATABASE_URL.replace("postgres://", "postgresql://", 1)

# SQLite (used in tests) is single-threaded by default; Postgres ignores this.
connect_args = {"check_same_thread": False} if DATABASE_URL.startswith("sqlite") else {}

engine = create_engine(DATABASE_URL, connect_args=connect_args)

SessionLocal = sessionmaker(autocommit=False, autoflush=False, bind=engine)


def get_db():
    db = SessionLocal()
    try:
        yield db
    finally:
        db.close()</code></pre>

<h3>The address</h3>
<p><code>os.getenv(A, B)</code> means: look for setting A; if missing use B. That single line is why identical code runs on your laptop and on Render — Render sets <code>DATABASE_URL</code> to its own database, so your code connects there with no edits.</p>
<div class="note"><b>localhost means "the computer I'm running on."</b> Inside Render's container that's the container itself, which has no PostgreSQL. Forget to set DATABASE_URL there and the deploy crashes with connection refused.</div>

<h3>The engine</h3>
<p>Your phone line to PostgreSQL, created <b>once</b>. It keeps a pool of connections open and lends them out, so no request waits to dial. <b>One engine per application.</b></p>

<h3>The session factory</h3>
<p>A session is a workspace for one request — a shopping cart. <code>SessionLocal</code> isn't a cart, it's what <i>makes</i> carts. <code>autocommit=False</code> means never check out on its own.</p>

<h3>get_db — the librarian</h3>
<p>Fetches the book, hands it over, <b>waits at the desk</b>, puts it away when you return.</p>
<table><tr><th>Keyword</th><th>What happens</th></tr>
<tr><td><code>yield</code></td><td>hand it out and pause; resume when the request ends</td></tr>
<tr><td><code>return</code></td><td>function ends now, so <code>finally</code> closes the session before you can use it</td></tr></table>
<p><code>finally</code> runs even when the endpoint crashes. Without it every crash leaks a connection, until PostgreSQL refuses new ones and the app freezes.</p>

<h3>Why one cart per request</h3>
<p>Shared cart: you add your activity, someone else adds theirs, you check out — and save their half-finished data too. Your rollback would undo their work as well.</p>
<div class="note"><b>commit</b> writes to PostgreSQL. <b>close</b> only returns the connection. Crash before commit and nothing is saved — everything between opening and commit lands together or not at all. That's a <b>transaction</b>.</div>`,
  qs:[
   ["What breaks if yield becomes return?","The function ends immediately, so finally closes the session. Your endpoint receives a closed session and crashes."],

   ["Does db.close() save your changes?","No. db.commit() saves; close only returns the connection. Crash before commit and nothing is written."],
   ["Why normalise postgres:// to postgresql://?","Render and Heroku hand out the old scheme, which SQLAlchemy 2 rejects. Without the fix the deploy crashes on startup with an obscure dialect error."]
  ]

  body:`
<p>PostgreSQL stores tables. Python thinks in objects. A model is a Python class describing one table.</p>

<div class="file">backend/app/models/base.py</div>
<pre><code>from sqlalchemy.orm import declarative_base

Base = declarative_base()</code></pre>
<p>Two lines, easy to skip. <code>Base</code> is a <b>register of tables</b>, empty at first. Any class inheriting from it is added automatically — that's all "inherit" means here. Then <code>Base.metadata.create_all(engine)</code> walks the register and creates what's missing.</p>

<div class="file">backend/app/models/user.py</div>
<pre><code>from sqlalchemy import Boolean, Column, DateTime, Integer, String
from app.models.base import Base


class User(Base):
    __tablename__ = "users"

    id            = Column(Integer, primary_key=True, index=True)
    name          = Column(String, nullable=False)
    email         = Column(String, unique=True, nullable=False)
    password_hash = Column(String, nullable=False)

    # False until proven via OTP; login is blocked while False.
    is_verified   = Column(Boolean, nullable=False, default=False)

    # Soft-delete timestamp; purged after the 5-day grace period.
    delete_requested_at = Column(DateTime, nullable=True)

    # Optional physiology for heart-rate based effort estimates.
    birth_year = Column(Integer, nullable=True)
    resting_hr = Column(Integer, nullable=True)
    max_hr     = Column(Integer, nullable=True)</code></pre>

<table><tr><th>Keyword</th><th>Meaning</th></tr>
<tr><td>primary_key=True</td><td>identifies the row; PostgreSQL assigns 1, 2, 3…</td></tr>
<tr><td>nullable=False</td><td>can never be empty</td></tr>
<tr><td>unique=True</td><td>no two rows may share this value</td></tr>
<tr><td>index=True</td><td>fast lookup, like a book's index</td></tr>
<tr><td>default=False</td><td>used when nobody supplies a value</td></tr></table>
<div class="note">These are enforced by <b>PostgreSQL itself</b>. Even a buggy app — or two requests arriving in the same millisecond — cannot create two accounts with the same email. Your 409 check exists to give a friendly error, not to be the real guard.</div>

<div class="file">backend/app/models/activity.py</div>
<pre><code>class Activity(Base):
    __tablename__ = "activities"

    id      = Column(Integer, primary_key=True, index=True)
    user_id = Column(Integer, ForeignKey("users.id"), nullable=False, index=True)

    activity_type = Column(String, nullable=False)

    # Nullable: strength work, sports and classes have no distance.
    distance_km  = Column(Float, nullable=True)
    duration_min = Column(Float, nullable=False)
    rpe          = Column(Integer, nullable=False)
    avg_hr       = Column(Integer, nullable=True)
    date         = Column(Date, nullable=False, default=date_type.today, index=True)
    notes        = Column(String, nullable=True)</code></pre>
<p><b>ForeignKey("users.id")</b> means this number must be a real id from the users table. It's how the database knows an activity belongs to a person, and it refuses an activity pointing at a user who doesn't exist.</p>
<p>Both <code>user_id</code> and <code>date</code> are indexed because every query filters or sorts on them.</p>

<div class="file">backend/app/models/otp.py</div>

  n:5, title:"Schemas", sub:"user_schemas.py · activity_schemas.py · constants.py",
  body:`
<p>Your API is public. Anyone can send anything. Schemas check every message <b>before</b> your code sees it.</p>

<h3>Model vs schema</h3>
<table><tr><th></th><th>Model</th><th>Schema</th></tr>
<tr><td>Inherits</td><td>Base</td><td>BaseModel</td></tr>
<tr><td>Describes</td><td>a table</td><td>a message</td></tr>
<tr><td>Lives</td><td>forever, on disk</td><td>milliseconds, in memory</td></tr></table>
<pre><code>class User(Base):            password_hash = Column(String)   # MODEL
class UserCreate(BaseModel): password: str                    # SCHEMA</code></pre>
<div class="note">That difference <b>is</b> the security boundary. The plain password exists only inside the schema, on its way to being hashed. It never reaches the model, so it never reaches the database.</div>

<div class="file">backend/app/schemas/user_schemas.py</div>
<pre><code>import re
from datetime import datetime
from typing import Optional
from pydantic import BaseModel, Field, field_validator

PASSWORD_RULES = [
    (r"[a-z]",         "a lowercase letter"),
    (r"[A-Z]",         "an uppercase letter"),
    (r"\\d",            "a number"),
    (r"[^A-Za-z0-9]",  "a special character"),
]
PASSWORD_MIN_LENGTH = 8


class UserCreate(BaseModel):
    name:     str = Field(min_length=1, max_length=100)
    email:    str = Field(min_length=3, max_length=255)
    password: str = Field(min_length=PASSWORD_MIN_LENGTH, max_length=128)

    @field_validator("password")
    @classmethod
    def password_is_strong(cls, value: str) -> str:
        missing = [label for pattern, label in PASSWORD_RULES
                   if not re.search(pattern, value)]
        if missing:
            raise ValueError("Password must contain " + ", ".join(missing))
        return value


class UserLogin(BaseModel):
    email: str
    password: str          # deliberately NO rules


class UserOut(BaseModel):
    id: int
    name: str
    email: str
    delete_requested_at: Optional[datetime] = None
    birth_year: Optional[int] = None
    resting_hr: Optional[int] = None
    max_hr: Optional[int] = None

    model_config = {"from_attributes": True}


class OTPVerify(BaseModel):
    email: str
    code: str = Field(min_length=6, max_length=6, pattern=r"^\\d{6}$")</code></pre>

<h4>The password validator</h4>
<p>Each rule is a pattern plus the wording for the error, so the API can say exactly what's missing rather than "invalid password". <code>@field_validator("password")</code> runs after the basic type and length checks pass. Raising <code>ValueError</code> becomes a 422.</p>

<h4>Why UserLogin has no rules</h4>
<p>Two reasons. Existing users whose password predates the rule could never log in. And a 422 saying "must contain an uppercase letter" tells an attacker their guess couldn't possibly be right — filtering their list for free. Validate where a value is <b>chosen</b>, not where it's <b>checked</b>.</p>

<h4>UserOut</h4>
<p>Note what's missing: <b>no password_hash</b>. Your endpoint returns the whole User object; only these seven fields survive. <code>from_attributes: True</code> is the permission slip letting Pydantic read a normal Python object rather than a dict — without it, returning a SQLAlchemy object fails.</p>

<h4>The regex</h4>
<p><code>^\\d{6}$</code> = start, exactly six digits, end. So "123456" passes; "12ab56", "12345", "1234567" all fail before your code runs.</p>

<div class="file">backend/app/schemas/activity_schemas.py</div>
<pre><code>class ActivityCreate(BaseModel):
    activity_type: str = Field(min_length=1, max_length=50)
    distance_km: Optional[float] = Field(default=None, gt=0, le=1000)
    duration_min: float = Field(gt=0, le=10080)
    rpe: int = Field(ge=1, le=10)
    avg_hr: Optional[int] = Field(default=None, ge=30, le=230)
    date: Optional[date_type] = None
    notes: Optional[str] = Field(default=None, max_length=500)

    @model_validator(mode="after")
    def check_type_and_distance(self):
        if self.activity_type not in ACTIVITY_TYPES:
            raise ValueError(f"Unknown activity type '{self.activity_type}'")
        if self.activity_type in DISTANCE_TYPES:
            if self.distance_km is None:
                raise ValueError(f"'{self.activity_type}' requires a distance in km")
        else:
            self.distance_km = None      # strip, don't reject
        return self</code></pre>
<table><tr><th>Rule</th><th>Meaning</th></tr>
<tr><td>gt=0</td><td>greater than zero — a 0 km run makes no sense</td></tr>
<tr><td>ge=1, le=10</td><td>the RPE scale</td></tr>
<tr><td>le=10080</td><td>7 days in minutes — a sanity ceiling</td></tr></table>

<h4>Field validator vs model validator</h4>
<p>A field validator checks one field alone. A <b>model</b> validator checks fields <i>against each other</i> — "a run needs a distance, a gym session must not have one." No single-field rule can express that. <code>mode="after"</code> means it runs once the individual checks have passed, so the types are already correct.</p>
<p>The last branch <b>silently strips</b> rather than rejecting. Don't trust the client, but don't punish them — clean the data quietly.</p>

<h4>Three schemas per thing</h4>
<table><tr><th>Schema</th><th>Direction</th><th>Rules</th></tr>
<tr><td>ActivityCreate</td><td>in</td><td>everything required</td></tr>
<tr><td>ActivityUpdate</td><td>in</td><td>everything optional (partial edit)</td></tr>
<tr><td>ActivityOut</td><td>out</td><td>what the client may see (no user_id)</td></tr></table>

<div class="file">backend/app/constants.py</div>
<pre><code>ACTIVITY_TYPES = {
    "run": "distance", "ride": "distance", "swim": "distance",
    "row": "distance", "hike": "distance", "walk": "distance",
    "strength": "strength", "crossfit": "strength",
    "calisthenics": "strength", "hiit": "strength",
    "football": "sport", "basketball": "sport", "cricket": "sport", ...
    "yoga": "other", "pilates": "other", "other": "other",
}

DISTANCE_TYPES = {t for t, cat in ACTIVITY_TYPES.items() if cat == "distance"}

THRESHOLD_MIN_KM = {"run":3.0, "ride":8.0, "swim":0.4, "row":1.0,
                    "hike":2.0, "walk":2.0}
THRESHOLD_MIN_MINUTES = 15
THRESHOLD_LOOKBACK_DAYS = 90
THRESHOLD_SHORT_MIN_MINUTES = 8
THRESHOLD_TARGET_MINUTES = 60
RIEGEL_EXPONENT = 0.06
RIEGEL_MAX_FACTOR = 1.15
DEFAULT_THRESHOLD_PACE = {"run":5.5, "ride":2.0, "swim":20.0, ...}</code></pre>
<h4>Reading the set comprehension</h4>
<pre><code>{t for t, cat in ACTIVITY_TYPES.items() if cat == "distance"}</code></pre>
<ul>
<li><code>.items()</code> gives pairs: ("run","distance"), ("strength","strength")…</li>
<li><code>for t, cat in</code> takes each pair apart</li>
<li><code>if cat == "distance"</code> keeps only those</li>
<li><code>{ t }</code> collects the names into a <b>set</b> — membership checks are instant</li>
</ul>
<p>Deriving it means the two lists can never disagree. Type it twice and one day you add a sport to one and forget the other.</p>
<div class="note">The honest weakness: the frontend keeps its own copy, because a browser can't import a Python file. A bigger app would generate the JS from the Python or serve the list from an endpoint.</div>`,

   ["Why does UserLogin have no password rules?","Existing users with older passwords would be locked out, and a 422 naming the missing rule tells an attacker their guess was impossible — filtering their list for them."],

   ["Field validator vs model validator?","Field checks one field alone. Model checks fields against each other — 'runs need a distance, gym sessions must not'."],
   ["Why strip a distance for football rather than reject it?","Don't trust the client, but don't punish them. Silently cleaning is friendlier and equally safe."],
   ["Why derive DISTANCE_TYPES rather than write it out?","Two hand-written lists drift apart. Deriving guarantees they agree."]

<div class="file">backend/app/services/security.py — the whole file</div>
<pre><code>from passlib.context import CryptContext

pwd_context = CryptContext(schemes=["bcrypt"], deprecated="auto")

def hash_password(password: str):
    return pwd_context.hash(password)

def verify_password(plain_password: str, hashed_password: str):
    return pwd_context.verify(plain_password, hashed_password)</code></pre>
<p>Nine lines, and they're the most security-critical in the app.</p>
<p><b>Hashing is a one-way blender.</b> <code>"Secret123!"</code> becomes <code>$2b$12$Xk9...</code> and cannot be reversed. Steal the database and you get smoothies, not fruit.</p>
<ul>
<li><b>Salted</b> — a random value is mixed in, so the same password hashes differently every time. That defeats precomputed rainbow tables: cracking one hash tells you nothing about another.</li>
<li><b>Deliberately slow</b> — bcrypt is expensive on purpose, so billions of guesses per second become thousands. The <code>$12$</code> in the hash is the cost factor.</li>
</ul>
<p><code>verify_password</code> doesn't decrypt. It re-hashes your attempt <b>using the salt stored inside the existing hash</b> and compares the results.</p>
<div class="note">Your requirements pin <code>bcrypt==4.0.1</code>. passlib 1.7.4 reads <code>bcrypt.__about__</code>, which bcrypt removed in 4.1 — anything newer breaks password hashing at runtime. A real dependency trap.</div>

<div class="file">backend/app/api/auth.py — register</div>
<pre><code>@router.post("/register", response_model=UserOut, status_code=201)
def register(user: UserCreate, db: Session = Depends(get_db)):
    if db.query(User).filter(User.email == user.email).first():
        raise HTTPException(status_code=409, detail="Email already registered")

    new_user = User(
        name=user.name,
        email=user.email,
        password_hash=hash_password(user.password),
        is_verified=False,
    )
    db.add(new_user)
    db.commit()
    db.refresh(new_user)

    send_otp_email(new_user.email, issue_otp(db, new_user.email))
    return new_user</code></pre>
<p>Duplicate check first, so the client gets a clean 409 rather than a raw database constraint crash. The password is hashed in the same expression that builds the user — the plaintext is never assigned to a variable that lives longer than that line. The account starts <b>unverified</b>.</p>

<div class="file">backend/app/services/otp_service.py — the whole file</div>
<pre><code>import secrets
from datetime import datetime, timedelta
from app.models.otp import EmailOTP

OTP_LIFETIME_MINUTES = 10
MAX_ATTEMPTS = 5
RESEND_COOLDOWN_SECONDS = 60


def issue_otp(db, email: str) -> str:
    # One active code per email: a resend invalidates any previous
    # (possibly intercepted) code.
    db.query(EmailOTP).filter(EmailOTP.email == email).delete()

    code = f"{secrets.randbelow(1_000_000):06d}"
    db.add(EmailOTP(
        email=email,
        code=code,
        expires_at=datetime.utcnow() + timedelta(minutes=OTP_LIFETIME_MINUTES),
    ))
    db.commit()
    return code


def seconds_until_resend_allowed(db, email: str) -> int:
    otp = db.query(EmailOTP).filter(EmailOTP.email == email).first()
    if otp is None:
        return 0
    elapsed = (datetime.utcnow() - otp.created_at).total_seconds()
    return max(0, int(RESEND_COOLDOWN_SECONDS - elapsed))


def check_otp(db, email: str, code: str) -> str:
    """Returns 'ok', 'expired', 'locked', or 'wrong'."""
    otp = db.query(EmailOTP).filter(EmailOTP.email == email).first()
    if otp is None or datetime.utcnow() > otp.expires_at:
        return "expired"
    if otp.attempts >= MAX_ATTEMPTS:
        return "locked"

    if otp.code != code:
        otp.attempts += 1        # count BEFORE returning
        db.commit()
        return "wrong"

    db.query(EmailOTP).filter(EmailOTP.email == email).delete()
    db.commit()
    return "ok"</code></pre>

<h4>Line by line</h4>
<p><code>f"{secrets.randbelow(1_000_000):06d}"</code> — a number 0–999999, formatted to six digits with leading zeros. <code>secrets</code>, not <code>random</code>: <code>random</code> is predictable from previous outputs and must never be used for anything security-related.</p>
<p><b>The delete-first line</b> means only one code is ever valid. Request a new one and the old is dead — so a code someone glimpsed is worthless.</p>
<p><b>attempts += 1 before returning</b> is deliberate. Increment after and a clever client could abandon the request mid-flight to avoid the count.</p>
<p><b>Returning a string, not a boolean.</b> "expired", "locked", "wrong" each need a different message. A bool would collapse them.</p>
<table><tr><th>Attack</th><th>Defence</th></tr>
<tr><td>guessing all million codes</td><td>5-attempt lockout</td></tr>
<tr><td>using an old intercepted code</td><td>10-minute expiry + delete on reissue</td></tr>
<tr><td>replaying a used code</td><td>deleted on success</td></tr>
<tr><td>spamming someone's inbox</td><td>60-second cooldown → 429</td></tr></table>
<div class="note">Six digits is a million options — nothing on its own. The lockout, expiry and single use are what make a short, human-typeable code safe.</div>

<div class="file">backend/app/services/email_service.py — the selection logic</div>
<pre><code>def send_otp_email(to_email: str, code: str):
    if os.getenv("RESEND_API_KEY"):
        transport, send = "Resend", _send_resend
    elif os.getenv("BREVO_API_KEY"):
        transport, send = "Brevo", _send_brevo
    elif os.getenv("SMTP_HOST") and os.getenv("SMTP_USER") and os.getenv("SMTP_PASS"):
        transport, send = "SMTP", _send_smtp
    else:
        _log_code(to_email, code, "NO MAIL TRANSPORT CONFIGURED")
        return

    try:
        send(to_email, code)
        logging.info("Verification email sent to %s via %s", to_email, transport)
    except Exception as exc:
        logging.error("%s delivery failed for %s: %s", transport, to_email, exc)
        _log_code(to_email, code, f"{transport} FAILED - code logged instead")</code></pre>
<p><b>This function never raises.</b> The user row is committed <i>before</i> the email is sent, so if sending raised, a mail outage would return 500 for an account that was actually created — and the user could never retry with that email, because it's now taken.</p>
<div class="note"><b>The production bug worth telling.</b> Gmail SMTP worked locally and failed on Render with <code>[Errno 101] Network is unreachable</code>. Cloud hosts block outbound SMTP ports as anti-spam. Fixed by sending over an HTTPS email API — port 443 is never blocked.</div>`,

   ["Why are two hashes of the same password different?","Each includes a random salt. Without it, identical passwords produce identical hashes and cracking one cracks them all."],

   ["Why increment attempts before returning 'wrong'?","So the count always lands. Increment afterwards and a client could abandon the request to dodge the limit."],
   ["Why is a 6-digit code safe?","Alone it isn't. The 5-attempt lockout, 10-minute expiry and single use are what make it safe."],
   ["Why must email delivery never raise?","The user row is already committed. Raising would return 500 for a created account, and the email would then be permanently taken."]

  n:7, title:"JWT and protecting routes", sub:"auth_services.py · dependencies.py · account_service.py",
  body:`
<h3>Why a token</h3>
<p>The server is stateless, so each request must prove who you are. Not the password — possession grants access, it never expires, and it would cross the network hundreds of times a day. Not the password <b>hash</b> either: that would make the hash the credential, so a database leak would hand out working keys.</p>
<p>You want something <b>temporary, disposable, and not your password</b>.</p>

<div class="file">backend/app/services/auth_services.py — the whole file</div>
<pre><code>import os
from datetime import datetime, timedelta
from jose import JWTError, jwt

SECRET_KEY = os.getenv("SECRET_KEY", "supersecretkey")
ALGORITHM = "HS256"
ACCESS_TOKEN_EXPIRE_HOURS = 12


def create_access_token(data: dict):
    to_encode = data.copy()          # never mutate the caller's dict
    expiration_time = datetime.utcnow() + timedelta(hours=ACCESS_TOKEN_EXPIRE_HOURS)
    to_encode.update({"exp": expiration_time})
    return jwt.encode(to_encode, SECRET_KEY, algorithm=ALGORITHM)


def verify_access_token(token: str):
    try:
        return jwt.decode(token, SECRET_KEY, algorithms=[ALGORITHM])
    except JWTError:
        return None</code></pre>
<p><code>data.copy()</code> matters: without it you'd add <code>exp</code> to the dict the caller passed in, a side effect they never asked for.</p>
<p><code>jwt.decode</code> checks <b>two</b> things — the signature and the expiry. Any failure returns None, so callers get a single "invalid" signal rather than four exception types.</p>
<p>The default <code>"supersecretkey"</code> is for development. Render generates a real one via <code>generateValue: true</code>.</p>

<h4>What a JWT actually is</h4>
<pre><code>header . payload . signature
eyJhbGci… . eyJzdWIi… . SflKxwRJ…</code></pre>
<table><tr><th>Part</th><th>Contents</th></tr>
<tr><td>header</td><td>which algorithm</td></tr>
<tr><td>payload</td><td>{"sub": your email, "exp": expiry}</td></tr>
<tr><td>signature</td><td>computed from header + payload + SECRET_KEY</td></tr></table>
<div class="note">The payload is <b>readable by anyone</b> — base64, not encryption. Paste a token into jwt.io and you'll see your email. Never put secrets in it. What it <i>is</i> is <b>unforgeable</b>: change one character and the signature stops matching, and you can't compute a new one without the key.</div>

<div class="file">backend/app/dependencies.py — the whole file</div>
<pre><code>oauth2_scheme = OAuth2PasswordBearer(tokenUrl="login")


def get_current_user(
    token: str = Depends(oauth2_scheme),
    db: Session = Depends(get_db),
) -> User:
    credentials_exception = HTTPException(
        status_code=401,
        detail="Could not validate credentials",
        headers={"WWW-Authenticate": "Bearer"},
    )

    payload = verify_access_token(token)
    if payload is None:
        raise credentials_exception

    email = payload.get("sub")
    if email is None:
        raise credentials_exception

    user = db.query(User).filter(User.email == email).first()
    if user is None:
        raise credentials_exception

    return user</code></pre>
<h4>Three things worth noticing</h4>
<p><b>A dependency with its own dependencies.</b> <code>get_current_user</code> needs <code>oauth2_scheme</code> (to read the header) and <code>get_db</code> (to look the user up). FastAPI resolves the whole chain before your endpoint runs.</p>
<p><b>One error object, raised three times.</b> Bad signature, malformed payload, deleted user — all identical. Saying "valid token but no such user" would confirm the token was genuine, which is information.</p>
<p><b>It returns a User, not an email.</b> So endpoints get the full row ready to use, and never repeat the lookup.</p>
<p><code>WWW-Authenticate: Bearer</code> is the HTTP spec's way of telling the client which auth scheme to use.</p>

<div class="file">backend/app/api/auth.py — login</div>
<pre><code>@router.post("/login", response_model=Token)
def login(credentials: UserLogin, db: Session = Depends(get_db)):
    purge_expired_accounts(db)      # opportunistic housekeeping

    user = db.query(User).filter(User.email == credentials.email).first()

    if not user or not verify_password(credentials.password, user.password_hash):
        raise HTTPException(status_code=401, detail="Incorrect email or password")

    if not user.is_verified:
        raise HTTPException(status_code=403, detail="Email not verified")

    token = create_access_token({"sub": user.email})
    return {"access_token": token, "token_type": "bearer"}</code></pre>
<p><b>One condition, two failures.</b> Unknown email and wrong password produce the identical 401, so nobody can discover which addresses have accounts.</p>
<p><b>403 is separate on purpose</b> — the frontend reads it and switches to the OTP screen.</p>

<div class="file">backend/app/services/account_service.py — the whole file</div>
<pre><code>GRACE_PERIOD_DAYS = 5


def purge_expired_accounts(db: Session) -> int:
    cutoff = datetime.utcnow() - timedelta(days=GRACE_PERIOD_DAYS)
    expired = (
        db.query(User)
        .filter(User.delete_requested_at.isnot(None),
                User.delete_requested_at <= cutoff)
        .all()
    )
    for user in expired:
        # Children first, then the parent, so foreign keys are never violated.
        db.query(Activity).filter(Activity.user_id == user.id).delete()
        db.query(EmailOTP).filter(EmailOTP.email == user.email).delete()
        db.delete(user)
    db.commit()
    return len(expired)</code></pre>
<p><b>Order matters.</b> Delete the user first and the activities would still point at a user id that no longer exists — the foreign key forbids it. Children first, always.</p>
<p><b>Soft delete</b> means the row survives with a timestamp, so it can be cancelled for 5 days. Requesting deletion needs the password again, so a stolen token alone can't destroy data.</p>
<p>Running this on login and at startup is "opportunistic cleanup" — no cron job needed at this scale. A bigger app would use a scheduled task.</p>`,

   ["Why do all three failure paths raise the same error?","So an attacker can't tell which check failed. 'Valid token, unknown user' would confirm the token was genuine."],
   ["Why delete activities before the user?","The foreign key requires every activity to point at a real user. Delete the parent first and the constraint is violated."],
   ["Why does deleting an account need the password again?","So a stolen but still-valid token can't destroy someone's data on its own."]
  ]

<p>403 says "this exists, but it isn't yours" — which confirms it exists. 404 makes someone else's data indistinguishable from data that never existed. Existence is itself information.</p>

<div class="file">create</div>
<pre><code>@router.post("", response_model=ActivityOut, status_code=201)
def create_activity(

        rpe=payload.rpe,
        avg_hr=payload.avg_hr,

    db.commit()

<pre><code>@router.get("", response_model=List[ActivityOut])

<p>One file: landing page, auth screens and dashboard, served by FastAPI. No framework — plain JavaScript.</p>

<h3>Why FastAPI serves it</h3>
<p>Opening it as <code>file://</code> gives the browser no real origin. That breaks the password manager (the Credential Management API needs a secure context) and makes OAuth impossible. Served from <code>http://localhost:8000</code> it's a proper origin, and frontend and API become same-origin so CORS disappears entirely.</p>

<h3>One state object</h3>
<pre><code>const state = {
  me: null, activities: [], summary: null, weekly: [], records: null,
  streak: null, thresholds: null, status: null,
  filter: "all", scope: "all", sort: "date-desc", weeks: 8,
  editingId: null, goals: loadGoals(),
};</code></pre>
<p>Every render function reads from here and nowhere else. One refresh reloads everything, so no widget can disagree with another. That's the discipline a framework would normally enforce for you.</p>

<h3>The fetch wrapper — the most reused function</h3>
<pre><code>const API = location.protocol.startsWith("http") ? "" : "http://localhost:8000";

async function api(method, path, body) {
  const headers = { "Content-Type": "application/json" };
  const token = localStorage.getItem("token");
  if (token) headers["Authorization"] = "Bearer " + token;

  const resp = await fetch(API + path, {
    method, headers,
    body: body ? JSON.stringify(body) : undefined,
  });

  if (resp.status === 401 && !["/login", "/verify-email"].includes(path)) {
    logout();
    throw new Error("Session expired - please log in again");
  }
  if (resp.status === 204) return null;

  const data = await resp.json().catch(() => ({}));
  if (!resp.ok) {
    const detail = typeof data.detail === "string" ? data.detail : "Request failed (" + resp.status + ")";
    const err = new Error(detail);
    err.status = resp.status;
    throw err;
  }
  return data;
}</code></pre>
<h4>Every line earns its place</h4>
<ul>
<li><b>Empty API base when served over http</b> — same-origin, so no CORS at all. The localhost fallback only matters if you open the file directly.</li>
<li><b>Token attached in one place.</b> Twenty-plus call sites, one place that knows about auth.</li>
<li><b>401 → logout</b>, except on login itself, where a 401 means "wrong password" and shouldn't log you out of a session you don't have.</li>
<li><b>204 returns null</b> before parsing — a 204 has no body, and <code>resp.json()</code> on an empty body throws.</li>
<li><b>err.status is attached</b> so callers can branch. That's how a 403 at login switches to the OTP screen instead of showing an error.</li>
</ul>

<h3>The 403 branch</h3>
<pre><code>try {
  const tok = await api("POST", "/login", { email, password });
  localStorage.setItem("token", tok.access_token);
  await rememberIfWanted(email, password);
  enterApp();
} catch (e) {
  if (e.status === 403) { showOtpStep(email); resendOtp(true); }
  else $("auth-error").textContent = e.message;
}</code></pre>
<p>The backend's deliberate choice of 403 for "unverified" pays off here: the frontend can tell "wrong password" from "right password, unverified account" and behave differently.</p>

<h3>Rendering — one refresh, then draw</h3>
<pre><code>async function refreshAll() {
  const [summary, weekly, records, streak, activities, status, thresholds] =
    await Promise.all([
      api("GET", "/analytics/summary"),
      api("GET", "/analytics/weekly?weeks=" + state.weeks),
      api("GET", "/analytics/records"),

}</code></pre>
<p><code>Promise.all</code> fires all seven requests <b>at once</b> rather than one after another. Seven sequential round trips would be seven times slower; in parallel the whole refresh costs about as long as the slowest one.</p>

<h3>Filtering happens in the browser</h3>
<pre><code>function visibleActivities() {

<h3>Escaping user text — the XSS guard</h3>
<pre><code>function escapeHtml(s) {
  return String(s).replace(/[&amp;&lt;>"']/g, c =>
    ({ "&amp;":"&amp;amp;", "&lt;":"&amp;lt;", ">":"&amp;gt;", '"':"&amp;quot;", "'":"&amp;#39;" }[c]));
}

\${a.notes ? \`&lt;div class="ac-desc">\${escapeHtml(a.notes)}&lt;/div>\` : ""}</code></pre>

<h3>Remember me — where the password goes</h3>
<pre><code>async function rememberIfWanted(email, password, name) {
  if (!$("remember-me").checked) { localStorage.removeItem("rememberedEmail"); return; }
  localStorage.setItem("rememberedEmail", email);

  if (window.PasswordCredential && navigator.credentials) {
    try {
      await navigator.credentials.store(new PasswordCredential({
        id: email, password, name: name || email,
      }));
    } catch (_) { /* user dismissed the prompt */ }
  }
}</code></pre>
<p>Only the <b>email</b> goes in localStorage. The password is handed to the browser, which stores it in the OS keychain and shows its own "Save password?" prompt. Anything in localStorage is readable by any JavaScript on the page — one XSS bug and a stored password is gone.</p>

<h3>The password generator</h3>
<pre><code>function generatePassword(length = 16) {
  const lower = "abcdefghijkmnopqrstuvwxyz";   // no l
  const upper = "ABCDEFGHJKLMNPQRSTUVWXYZ";    // no I or O
  const digits = "23456789";                   // no 0 or 1
  const special = "!@#$%^&amp;*-_=+?";
  const all = lower + upper + digits + special;

  const pick = set => set[crypto.getRandomValues(new Uint32Array(1))[0] % set.length];
  const chars = [pick(lower), pick(upper), pick(digits), pick(special)];
  while (chars.length &lt; length) chars.push(pick(all));

  for (let i = chars.length - 1; i > 0; i--) {          // Fisher-Yates
    const j = crypto.getRandomValues(new Uint32Array(1))[0] % (i + 1);
    [chars[i], chars[j]] = [chars[j], chars[i]];
  }
  return chars.join("");
}</code></pre>
<ul>
<li><b>crypto.getRandomValues, never Math.random.</b> Math.random is predictable from previous outputs — fine for shuffling a UI, catastrophic for a password.</li>
<li><b>One character from each set first</b>, so it satisfies every rule <i>by construction</i> rather than by chance.</li>
<li><b>Then shuffled</b>, so position doesn't leak which set a character came from.</li>
<li><b>Ambiguous characters removed</b> so it's readable if typed by hand.</li>
</ul>

<h3>Theming without a flash</h3>
<pre><code>&lt;!-- in &lt;head>, before the body paints -->
(function () {
  var saved = localStorage.getItem("theme");
  if (saved &amp;&amp; saved !== "system") document.documentElement.setAttribute("data-theme", saved);
})();</code></pre>
<pre><code>function applyTheme(mode) {
  if (mode === "system") document.documentElement.removeAttribute("data-theme");
  else document.documentElement.setAttribute("data-theme", mode);

<p>"System" <b>removes</b> the attribute so the <code>prefers-color-scheme</code> media query takes over. The head script runs before first paint, so a light-mode user never sees a flash of dark.</p>

<h3>The Chart.js trap</h3>
<pre><code>.chart-box { position: relative; height: 260px; width: 100%; }</code></pre>
<p>With <code>maintainAspectRatio: false</code>, Chart.js sizes the canvas to its parent. If the parent has no height it sizes to the canvas — each resize feeds the next and the chart grows forever. A fixed-height wrapper breaks the loop.</p>`,

<h3>Git vs GitHub</h3>
<p><b>Git</b> is a program on your computer that records snapshots of your files. <b>GitHub</b> is a website that stores a copy. Git works offline; GitHub is where you publish.</p>

<h3>The three places a change can be</h3>
<table><tr><th>Place</th><th>Meaning</th></tr>
<tr><td>working tree</td><td>your actual files, as you edit them</td></tr>
<tr><td>staging area</td><td>changes marked for the next snapshot</td></tr>
<tr><td>repository</td><td>the snapshots themselves</td></tr></table>
<pre><code>git add -A              # working tree → staging
git commit -m "..."     # staging      → repository
git push                # repository   → GitHub</code></pre>
<p>Staging exists so you can commit <i>some</i> changes and not others, keeping each commit about one thing. <code>-A</code> means all changes.</p>

<h3>A commit</h3>
<p>A snapshot, a message, an author, a timestamp, and a link to the commit before it. That chain is the history. Each gets a hash like <code>2fda9e7</code> — its permanent name.</p>
<pre><code>git status              # what's changed, what's staged
git log --oneline -3    # last three commits
git diff                # what changed, line by line</code></pre>
<div class="note"><b>"Your branch is ahead of origin/main by 1 commit"</b> means you committed but didn't push. It happened to you: the objects uploaded but the branch pointer never moved, so Render never saw the change. A commit is local until you push.</div>

<div class="file">.gitignore</div>
<pre><code># Secrets - never commit
backend/.env

# Test artefacts
backend/test_*.db
.pytest_cache/
.ruff_cache/

# Python
__pycache__/
*.pyc
backend/venv/

# OS / editor
.DS_Store
Thumbs.db
.vscode/</code></pre>
<p>Two rules:</p>
<ul>
<li><b>Never commit secrets.</b> Your <code>.env</code> holds a Gmail app password and a Brevo API key. The repo is public — this one line stands between you and leaking them.</li>
<li><b>Never commit generated things.</b> <code>venv/</code> is hundreds of megabytes and fully rebuildable from <code>requirements.txt</code>. <code>__pycache__</code> is regenerated on every run.</li>
</ul>
<p>The mirror of this is that anything <i>not</i> generated must be committed — which is why <code>requirements.txt</code> exists. It's the recipe that lets anyone rebuild the thing you didn't commit.</p>

<h3>Things that bit you</h3>
<p><b>"LF will be replaced by CRLF"</b> — Windows ends lines with two characters, Linux with one. Git converts on the way in and out so the same file works on both. A warning, not an error.</p>
<p><b>"Deletion of directory .git/objects/06 failed"</b> — OneDrive holds file handles open while syncing, so git can't delete its own temporary files. Cosmetic. The real fix is keeping repos outside OneDrive; GitHub is already your backup, so cloud-syncing a repo adds nothing but conflicts.</p>
<p><b>Application Control blocking pip.exe</b> — run <code>python -m pip</code> instead. That never launches the blocked executable; it runs the module inside the already-allowed <code>python.exe</code>.</p>

<h3>The chain to keep in your head</h3>
<pre><code>editor → local server   (instant, on save)
       → GitHub          (only after git push)
       → Render          (only after GitHub, ~3 min)</code></pre>
<p>Test locally first — it's free and instant. Push when you're happy; every push costs a CI run and a deploy.</p>`,

  n:13, title:"Continuous integration", sub:"ci.yml — five jobs",
  body:`
<h3>What CI means</h3>
<p>Every push, a fresh machine checks out your code and runs your checks. Fail and you get a red X before the code reaches anyone.</p>
<p>The point isn't that you couldn't run the tests yourself — it's that <b>you can't forget</b>, and it runs on a clean machine, so "works on my laptop" stops being a defence.</p>

<h3>Vocabulary</h3>
<table><tr><th>Word</th><th>Means</th></tr>
<tr><td>workflow</td><td>one YAML file describing what to run</td></tr>
<tr><td>trigger</td><td>what starts it</td></tr>
<tr><td>job</td><td>an independent task on its own fresh machine</td></tr>
<tr><td>step</td><td>one command inside a job</td></tr>
<tr><td>action</td><td>a reusable step someone published</td></tr>
<tr><td>runner</td><td>the throwaway machine it runs on</td></tr></table>

<div class="file">.github/workflows/ci.yml — trigger</div>
<pre><code>name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:          # adds a manual "Run" button

concurrency:
  group: \${{ github.workflow }}-\${{ github.ref }}
  cancel-in-progress: true</code></pre>
<p><code>concurrency</code> cancels an in-flight run when you push again to the same branch — no point testing code that's already been replaced. Saves minutes and money.</p>

<div class="file">a job</div>
<pre><code>test:
  name: Tests (SQLite)
  runs-on: ubuntu-latest
  steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: "3.11"
        cache: pip
    - name: Install dependencies
      working-directory: backend
      run: pip install -r requirements-dev.txt
    - name: Run test suite
      working-directory: backend
      run: pytest -v</code></pre>
<ul>
<li><code>uses:</code> runs a published action; <code>run:</code> runs a shell command.</li>
<li><b>checkout is always first</b> — the runner starts completely empty and doesn't have your code until you ask for it.</li>
<li><code>cache: pip</code> reuses downloaded packages between runs, cutting install time.</li>
<li><code>@v4</code> pins the action's major version, so it can't change under you without warning.</li>
</ul>
<p>All five jobs start <b>at the same time</b> on separate machines, which is why the whole run finishes in about 90 seconds.</p>

<div class="file">the Postgres job — service containers</div>
<pre><code>test-postgres:
  runs-on: ubuntu-latest
  services:
    postgres:
      image: postgres:16
      env:
        POSTGRES_USER: postgres
        POSTGRES_PASSWORD: postgres
        POSTGRES_DB: endurancehub_test
      ports: ["5432:5432"]
      options: >-
        --health-cmd pg_isready
        --health-interval 10s
        --health-timeout 5s
        --health-retries 5
  steps:
    ...
    - name: Run test suite
      env:
        TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/endurancehub_test
      run: pytest -v</code></pre>
<p>A real PostgreSQL container started alongside the job. The <b>health options make the job wait</b> until it accepts connections — without them the tests would sometimes start too early and fail at random, which is the worst kind of test failure.</p>
<p><code>TEST_DATABASE_URL</code> is the hook <code>conftest.py</code> reads, which is why the same suite can run on either database with no code change.</p>

<div class="file">the frontend job</div>
<pre><code>- name: Syntax-check the app script
  run: |
    python3 - &lt;&lt;'PY'
    import re, pathlib
    html = pathlib.Path("frontend/index.html").read_text(encoding="utf-8")
    script = max(re.findall(r"&lt;script>(.*?)&lt;/script>", html, re.S), key=len)
    pathlib.Path("/tmp/app.js").write_text(script)
    PY
    node --check /tmp/app.js</code></pre>
<p>Extracts the largest script block and syntax-checks it with Node. Two more steps verify every icon reference resolves to a defined symbol, and that there are no duplicate element IDs or inline handlers pointing at functions that don't exist.</p>
<div class="note">This job caught a real bug: adding a second <code>&lt;script></code> (the pre-paint theme setter) broke a regex that assumed one block. Hence <code>max(..., key=len)</code> — take the largest, which is the app.</div>

<div class="file">the Docker job</div>
<pre><code>- run: docker build -t endurancehub:ci .
- name: Container starts and serves /health
  run: |
    docker run -d --name eh -p 8000:8000 \\
      -e DATABASE_URL=sqlite:///./ci.db -e SECRET_KEY=ci-secret endurancehub:ci
    for i in $(seq 1 20); do
      if curl -fs http://localhost:8000/health; then echo " - healthy"; exit 0; fi
      sleep 2
    done
    echo "container never became healthy"; docker logs eh; exit 1</code></pre>
<p>Building isn't enough — an image can build and still fail to start. This runs it and polls <code>/health</code> up to 20 times, printing the container logs if it never answers.</p>

<h3>The five jobs</h3>
<table><tr><th>Job</th><th>Catches</th></tr>
<tr><td>Lint (ruff)</td><td>unused imports, undefined names</td></tr>
<tr><td>Tests (SQLite)</td><td>logic bugs, fast feedback</td></tr>
<tr><td>Tests (PostgreSQL 16)</td><td>dialect-specific bugs SQLite hides</td></tr>
<tr><td>Frontend checks</td><td>syntax, broken icon refs, duplicate IDs, orphaned handlers</td></tr>
<tr><td>Docker</td><td>image builds, container starts, /health answers</td></tr></table>`,

   ["Why does every job begin with checkout?","Each job gets a fresh, empty machine. It has no idea what your repo is until checkout copies it there."],

   ["Why isn't 'docker build succeeded' enough?","An image can build and still crash on startup. The job runs it and polls /health before passing."],
   ["What is concurrency: cancel-in-progress for?","Push twice quickly and the first run is cancelled — no point testing code that's already replaced."]

<h3>The problem containers solve</h3>
<p>Your app needs Python 3.11, specific libraries, and a particular layout. A server has none of that. A <b>container</b> packages the OS, runtime, dependencies and your code into one image that runs identically anywhere.</p>

<div class="file">Dockerfile — the whole file</div>
<pre><code>FROM python:3.11-slim

ENV PYTHONDONTWRITEBYTECODE=1 \\
    PYTHONUNBUFFERED=1

WORKDIR /app

# Dependencies first: this layer is cached until requirements.txt changes,
# so code edits rebuild in seconds rather than reinstalling everything.
COPY backend/requirements.txt backend/requirements.txt
RUN pip install --no-cache-dir -r backend/requirements.txt

COPY backend/ backend/
COPY frontend/ frontend/

WORKDIR /app/backend
EXPOSE 8000

CMD ["sh", "-c", "uvicorn app.main:app --host 0.0.0.0 --port \${PORT:-8000}"]</code></pre>
<table><tr><th>Line</th><th>Why</th></tr>
<tr><td>FROM python:3.11-slim</td><td>start from an image with Python already installed; "slim" drops what you don't need</td></tr>
<tr><td>PYTHONDONTWRITEBYTECODE</td><td>skip .pyc files — pointless in a throwaway container</td></tr>
<tr><td>PYTHONUNBUFFERED</td><td>print immediately, so logs appear live instead of being held in a buffer</td></tr>
<tr><td>COPY requirements first</td><td>layer caching — see below</td></tr>
<tr><td>--no-cache-dir</td><td>don't keep pip's download cache in the image</td></tr>
<tr><td>0.0.0.0</td><td>listen on all interfaces; localhost would be unreachable from outside</td></tr>
<tr><td>\${PORT:-8000}</td><td>the host assigns a port at runtime; shell form is needed to expand it</td></tr></table>
<div class="note"><b>Layer caching.</b> Each line creates a layer, and Docker reuses layers whose inputs haven't changed. Copying <code>requirements.txt</code> and installing <i>before</i> copying your code means editing a Python file doesn't reinstall FastAPI. Copy everything first and every build reinstalls from scratch — minutes instead of seconds.</div>
<p><code>parents[2]</code> in main.py resolves to <code>/app</code> inside the container, so <code>/app/frontend</code> is found exactly as it is locally. That's why the same path code works in both places.</p>

<div class="file">.dockerignore</div>
<pre><code>**/venv/
**/__pycache__/
**/*.pyc
**/.env
**/test_*.db
.git/
.github/
docs/
*.md</code></pre>
<p>Keeps the image small and, critically, keeps <code>.env</code> out of it. A secret baked into an image travels wherever the image goes.</p>

<div class="file">render.yaml — infrastructure as code</div>
<pre><code>services:
  - type: web
    name: endurancehub
    runtime: docker
    plan: free
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:

          property: connectionString
      - key: BREVO_API_KEY
        sync: false
      - key: MAIL_FROM
        sync: false

databases:
  - name: endurancehub-db
    plan: free
    databaseName: endurancehub
    user: endurancehub</code></pre>
<table><tr><th>Setting</th><th>Meaning</th></tr>
<tr><td>generateValue: true</td><td>Render invents a random secret — production never uses the dev default</td></tr>
<tr><td>fromDatabase</td><td>wires the database address in automatically, no copy-paste</td></tr>
<tr><td>sync: false</td><td>"this variable exists, ask me in the dashboard" — secrets stay out of the repo</td></tr>
<tr><td>healthCheckPath</td><td>traffic only switches once /health answers</td></tr>
<tr><td>autoDeploy: true</td><td>every push to main redeploys</td></tr></table>
<p>The whole file is <b>infrastructure as code</b>: the servers and database are described in a file in the repo, versioned alongside the app, rather than clicked together in a dashboard nobody can reproduce.</p>

<h3>What CD actually is</h3>
<pre><code>git push
  → GitHub stores the commit
  → CI runs five jobs
  → Render sees the new commit, builds the image
  → starts a container, polls /health
  → healthy?     switch traffic to it
  → not healthy? keep the old one running</code></pre>
<p>That last line is the point: a broken build never becomes the live site.</p>

<div class="file">backend/app/databases/schema_sync.py</div>
<pre><code>MIGRATIONS = [
    "ALTER TABLE users ADD COLUMN IF NOT EXISTS is_verified BOOLEAN NOT NULL DEFAULT FALSE",
    "ALTER TABLE users ADD COLUMN IF NOT EXISTS delete_requested_at TIMESTAMP NULL",
    "ALTER TABLE users ADD COLUMN IF NOT EXISTS birth_year INTEGER NULL",
    ...
    "ALTER TABLE activities ALTER COLUMN distance_km DROP NOT NULL",
]


def sync_schema(engine) -> int:
    if engine.dialect.name != "postgresql":
        return 0                      # SQLite tests get a fresh DB anyway

    applied = 0
    for sql in MIGRATIONS:
        try:
            with engine.begin() as conn:
                conn.execute(text(sql))
            applied += 1
        except Exception as exc:
            logging.warning("Schema sync skipped: %s (%s)", sql, exc)
    return applied</code></pre>
<p><code>create_all()</code> creates missing <b>tables</b> but never missing <b>columns</b>. Every new field crashed with "column does not exist" until this existed — three separate times.</p>
<ul>
<li><b>Idempotent</b> — <code>ADD COLUMN IF NOT EXISTS</code> does nothing on the second run, and <code>DROP NOT NULL</code> is a no-op once already dropped. Safe on every boot.</li>
<li><b>Each in its own transaction</b> (<code>engine.begin()</code> per statement) so one failure can't roll back the rest.</li>
<li><b>Failures are logged, not raised</b> — a single unsupported statement shouldn't stop the app booting.</li>
</ul>
<div class="note">The grown-up answer is <b>Alembic</b> — versioned, reversible migrations including destructive ones like renaming or dropping a column. This only handles the additive case. Knowing the limit matters more than the code.</div>

<div class="file">backend/app/env_loader.py — the whole file</div>
<pre><code>def load_env():
    env_file = Path(__file__).resolve().parents[1] / ".env"
    if not env_file.exists():
        return
    for line in env_file.read_text().splitlines():
        line = line.strip()
        if not line or line.startswith("#") or "=" not in line:
            continue
        key, _, value = line.partition("=")
        os.environ.setdefault(key.strip(), value.strip())</code></pre>

<p>No external library needed; it's twelve lines.</p>

<h3>The production bug worth telling in an interview</h3>
<p>Gmail SMTP worked perfectly on localhost and failed on Render with <code>[Errno 101] Network is unreachable</code>. Cloud hosts block outbound SMTP ports as an anti-spam measure. Diagnosed from the logs, fixed by sending over an HTTPS email API instead — port 443 is never blocked — and by making delivery non-fatal, because the account row commits before the email goes out.</p>`,

function togglePart(n) {
  const el = document.getElementById("p" + n);
  el.classList.toggle("open");
  if (el.classList.contains("open")) el.scrollIntoView({ behavior: "smooth", block: "start" });
}

function toggleDone(n) {
  const i = done.indexOf(n);
  if (i === -1) done.push(n); else done.splice(i, 1);
  localStorage.setItem("eh-progress", JSON.stringify(done));
  location.reload();
}

function updateBar() {
  const pct = (done.length / PARTS.length) * 100;
  document.getElementById("bar").style.width = pct + "%";
  document.getElementById("bar-lbl").textContent = `${done.length} of ${PARTS.length} parts done`;
}
updateBar();

/* ---------- theme ---------- */
function cycleTheme() {
  const order = ["system", "light", "dark"];
  const now = localStorage.getItem("theme") || "system";
  applyTheme(order[(order.indexOf(now) + 1) % 3]);
}
function applyTheme(mode) {
  localStorage.setItem("theme", mode);
  if (mode === "system") document.documentElement.removeAttribute("data-theme");
  else document.documentElement.setAttribute("data-theme", mode);
  document.getElementById("theme-btn").textContent =
    mode === "system" ? "Auto" : mode === "light" ? "Light" : "Dark";
}
applyTheme(localStorage.getItem("theme") || "system");
</script>
</body>
</html>
