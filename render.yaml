# Render Blueprint: provisions the web service and its database together.
# In Render, choose "New > Blueprint" and point it at this repository.
services:
  - type: web
    name: endurancehub
    runtime: docker
    plan: free
    healthCheckPath: /health
    # Every push to main redeploys automatically.
    autoDeploy: true
    envVars:
      # Generated once and kept secret - never the dev default.
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: endurancehub-db
          property: connectionString
      # Render blocks outbound SMTP, so mail goes over an HTTPS API.
      # Set one of these in the dashboard; unset means codes are logged.
      - key: BREVO_API_KEY
        sync: false
      - key: MAIL_FROM
        sync: false
      - key: RESEND_API_KEY
        sync: false

databases:
  - name: endurancehub-db
    plan: free
    databaseName: endurancehub
    user: endurancehub
