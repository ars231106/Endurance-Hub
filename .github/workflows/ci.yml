name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  # A new push to the same branch cancels the previous run.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      # Pinned deliberately. An unpinned linter means a new release can
      # turn a green build red with no code change - which is exactly what
      # happened when ruff 0.17 started flagging trailing whitespace inside
      # an import block. Upgrade on purpose, not by surprise.
      - run: pip install ruff==0.17.1
      - name: Ruff
        working-directory: backend
        run: ruff check .

  security:
    name: Security scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install scanners
        # Pinned for the same reason as ruff above.
        run: pip install pip-audit==2.9.0 bandit==1.8.6
      - name: Known vulnerabilities in dependencies
        working-directory: backend
        # Advisory rather than blocking: a transitive CVE with no fix
        # available should not stop a deploy, but it must be visible.
        continue-on-error: true
        run: pip-audit -r requirements.txt
      - name: Static analysis for insecure patterns
        working-directory: backend
        run: bandit -r app -ll -x app/tests

  test:
    name: Tests (SQLite)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        working-directory: backend
        run: pip install -r requirements-dev.txt
      - name: Run test suite
        working-directory: backend
        run: pytest -v

  test-postgres:
    name: Tests (PostgreSQL)
    runs-on: ubuntu-latest
    # Runs the same suite against the real database engine used in
    # production - SQLite alone would hide dialect-specific bugs.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: endurancehub_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        # Exercises the Redis paths too - rate limiting, revocation and the
        # analytics cache behave differently when it is present.
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        working-directory: backend
        run: pip install -r requirements-dev.txt
      - name: Run test suite
        working-directory: backend
        env:
          TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/endurancehub_test
          TEST_REDIS_URL: redis://localhost:6379/0
        run: pytest -v

  migrations:
    name: Migrations apply cleanly
    runs-on: ubuntu-latest
    # A migration that only ever runs against a developer's database is a
    # migration that breaks in production. This applies every revision to
    # an empty database, then rolls the whole chain back.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: migration_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        working-directory: backend
        run: pip install -r requirements.txt
      - name: Upgrade to head
        working-directory: backend
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/migration_test
        run: alembic upgrade head
      - name: Downgrade to base
        working-directory: backend
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/migration_test
        run: alembic downgrade base

  frontend:
    name: Frontend checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Syntax-check the app script
        run: |
          python3 - <<'PY'
          import re, pathlib
          html = pathlib.Path("frontend/index.html").read_text(encoding="utf-8")
          # The page has more than one <script> (a tiny pre-paint theme
          # setter in <head>), so take the largest block - the app itself.
          script = max(re.findall(r"<script>(.*?)</script>", html, re.S), key=len)
          pathlib.Path("/tmp/app.js").write_text(script)
          PY
          node --check /tmp/app.js
      - name: Verify every icon reference resolves
        run: |
          python3 - <<'PY'
          import re, pathlib, sys
          html = pathlib.Path("frontend/index.html").read_text(encoding="utf-8")
          script = max(re.findall(r"<script>(.*?)</script>", html, re.S), key=len)
          defined = set(re.findall(r'<symbol id="i-([\w-]+)"', html))
          used = (set(re.findall(r'<use href="#i-([\w-]+)"', html))
                  | set(re.findall(r'\bic\("([\w-]+)"', script))
                  | set(re.findall(r'icon: "([\w-]+)"', script)))
          broken = sorted(used - defined)
          if broken:
              sys.exit(f"Icons referenced but not defined: {broken}")
          print(f"{len(defined)} icons defined, all references resolve")
          PY
      - name: Verify element IDs and handlers exist
        run: |
          python3 - <<'PY'
          import re, pathlib, sys
          html = pathlib.Path("frontend/index.html").read_text(encoding="utf-8")
          script = max(re.findall(r"<script>(.*?)</script>", html, re.S), key=len)
          handlers = (set(re.findall(r'onclick="(\w+)\(', html))
                      | set(re.findall(r'onchange="(\w+)\(', html))
                      | set(re.findall(r'oninput="(\w+)\(', html)))
          defined = (set(re.findall(r'function (\w+)\(', script))
                     | set(re.findall(r'async function (\w+)\(', script)))
          missing = sorted(handlers - defined - {"if"})
          if missing:
              sys.exit(f"Inline handlers with no function: {missing}")
          ids = re.findall(r'\bid="([^"]+)"', html)
          dupes = sorted({i for i in ids if ids.count(i) > 1})
          if dupes:
              sys.exit(f"Duplicate element IDs: {dupes}")
          print("handlers and IDs OK")
          PY

  docker:
    name: Docker image builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: docker build --build-arg GIT_COMMIT=${{ github.sha }} -t endurancehub:ci .
      - name: Container starts and serves /health
        run: |
          # One worker so the startup migration runs exactly once against
          # SQLite, which has no cross-process locking to rely on.
          docker run -d --name eh -p 8000:8000 \
            -e DATABASE_URL=sqlite:///./ci.db \
            -e SECRET_KEY=ci-secret \
            -e WEB_CONCURRENCY=1 \
            endurancehub:ci
          for i in $(seq 1 30); do
            if curl -fs http://localhost:8000/health; then echo " - healthy"; break; fi
            sleep 2
            if [ "$i" = "30" ]; then echo "never became healthy"; docker logs eh; exit 1; fi
          done
      - name: Security headers are present
        run: |
          headers=$(curl -sI http://localhost:8000/health)
          for h in "x-content-type-options" "x-frame-options" "content-security-policy"; do
            echo "$headers" | grep -qi "$h" || { echo "missing header: $h"; exit 1; }
          done
          echo "security headers present"
      - name: Container runs as non-root
        run: |
          uid=$(docker exec eh id -u)
          [ "$uid" != "0" ] || { echo "container is running as root"; exit 1; }
          echo "running as uid $uid"

  deploy:
    name: Deploy to Render
    runs-on: ubuntu-latest
    # CI gates CD: deployment happens only after every check passes, and
    # only from main. Previously Render deployed on push regardless of
    # whether the tests were red.
    needs: [lint, security, test, test-postgres, migrations, frontend, docker]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - name: Trigger Render deploy
        env:
          HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
        run: |
          if [ -z "$HOOK" ]; then
            echo "RENDER_DEPLOY_HOOK is not set; skipping deploy."
            exit 0
          fi
          curl -fsS -X POST "$HOOK" && echo "deploy triggered"
